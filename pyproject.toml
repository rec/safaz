[project]
name = "safaz"
version = "0.2.0"
description = "SFZ import and export for uFor instruments"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.13"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14","Programming Language :: Python :: 3.15"]
dependencies = ["ufor", "pydantic>=2.13.4", "soundfile"]

[project.urls]
Repository = "https://github.com/rec/safaz"

[dependency-groups]
dev = [
    "pytest",
    "pytest-regressions",
    "pytest-xdist>=3.8.0",
    "ruff",
    "ty",
    "pyupgrade",
    "envelfo",
]

reference = ["enge", "numpy", "mido"]

[tool.uv]
override-dependencies = [
    "meedee @ git+ssh://git@github.com/rec/meedee.git@26e3891546efeb3cda8c570f0d4fdb72b74985b7",
    "ufor @ git+ssh://git@github.com/rec/ufor.git@b109c591dac9b87249afa945b571b20985fc09d2",
    "envelfo @ git+ssh://git@github.com/rec/envelfo.git@a9213ce9d99602866022339975ae5469e7784985",
]

[tool.uv.sources]
enge = { git = "ssh://git@github.com/rec/enge.git", rev = "8c93502e4efbecbaf84741aede8f5704c22e8dab" }
ufor = { git = "ssh://git@github.com/rec/ufor.git", rev = "b109c591dac9b87249afa945b571b20985fc09d2" }
envelfo = { git = "ssh://git@github.com/rec/envelfo.git", rev = "a9213ce9d99602866022339975ae5469e7784985" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test"]
