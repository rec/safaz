[project]
name = "safaz"
version = "0.2.0"
description = "SFZ import and export for uFor instruments"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.13"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14","Programming Language :: Python :: 3.15"]
dependencies = ["ufor", "pydantic>=2.13.4", "soundfile", "reccy"]

[project.urls]
Repository = "https://github.com/rec/safaz"

[dependency-groups]
dev = [
    "pytest",
    "pytest-regressions",
    "pytest-xdist>=3.8.0",
    "ruff",
    "ty",
    "pyupgrade",
    "envelfo",
]

reference = ["enge", "numpy", "mido"]

[tool.uv]
override-dependencies = [
    "meedee @ git+ssh://git@github.com/rec/meedee.git@26e3891546efeb3cda8c570f0d4fdb72b74985b7",
    "ufor @ git+ssh://git@github.com/rec/ufor.git@8046380a63b23ad4e2d6acf0a1880107efd8d3d0",
    "envelfo @ git+ssh://git@github.com/rec/envelfo.git@ea3533233e3f127806938fc929779edf42e2fce0",
]

[tool.uv.sources]
reccy = { git = "https://github.com/rec/reccy.git", branch = "main" }
enge = { git = "ssh://git@github.com/rec/enge.git", rev = "af2c476f4b2b59fc83d2aab6ce9bbb12aa1bb05a" }
ufor = { git = "ssh://git@github.com/rec/ufor.git", rev = "8046380a63b23ad4e2d6acf0a1880107efd8d3d0" }
envelfo = { git = "ssh://git@github.com/rec/envelfo.git", rev = "ea3533233e3f127806938fc929779edf42e2fce0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test"]
