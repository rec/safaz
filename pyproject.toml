[project]
name = "safaz"
version = "0.1.0"
description = "SFZ import and export for uFor instruments"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.13"
dependencies = ["ufor", "pydantic>=2.13.4", "soundfile"]

[project.urls]
Repository = "https://github.com/rec/safaz"

[dependency-groups]
dev = [
    "pytest",
    "pytest-regressions",
    "pytest-xdist>=3.8.0",
    "ruff",
    "ty",
    "pyupgrade",
]

[tool.uv.sources]
ufor = { git = "ssh://git@github.com/rec/ufor.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test"]
