[project]
name = "safaz"
version = "0.2.0"
description = "SFZ import and export for uFor instruments"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.13"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14","Programming Language :: Python :: 3.15"]
dependencies = ["ufor", "pydantic>=2.13.4", "soundfile", "reccy"]

[project.urls]
Repository = "https://github.com/rec/safaz"

[dependency-groups]
dev = [
    "pytest",
    "pytest-regressions",
    "pytest-xdist>=3.8.0",
    "ruff",
    "ty",
    "pyupgrade",
    "envelfo",
]

reference = ["enge", "numpy", "mido"]

[tool.uv]
override-dependencies = [
    "reccy @ git+https://github.com/rec/reccy.git@4757c0a9537217e627aea57888c451d34185f71f",
    "meedee @ git+ssh://git@github.com/rec/meedee.git@26e3891546efeb3cda8c570f0d4fdb72b74985b7",
    "ufor @ git+ssh://git@github.com/rec/ufor.git@fcf6f596b138baa7f07e7cf1feb758ccf02840e5",
    "envelfo @ git+ssh://git@github.com/rec/envelfo.git@181bad83532c427963948bcf19fed02aa2c22646",
]

[tool.uv.sources]
reccy = { git = "https://github.com/rec/reccy.git", rev = "4757c0a9537217e627aea57888c451d34185f71f" }
enge = { git = "ssh://git@github.com/rec/enge.git", rev = "2c73c327f54071bb5d7b61c5f4a1afe282602bcd" }
ufor = { git = "ssh://git@github.com/rec/ufor.git", rev = "fcf6f596b138baa7f07e7cf1feb758ccf02840e5" }
envelfo = { git = "ssh://git@github.com/rec/envelfo.git", rev = "181bad83532c427963948bcf19fed02aa2c22646" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test"]
