[project]
name = "safaz"
version = "0.2.0"
description = "SFZ import and export for uFor instruments"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.13"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14","Programming Language :: Python :: 3.15"]
dependencies = ["ufor", "pydantic>=2.13.4", "soundfile", "reccy"]

[project.urls]
Repository = "https://github.com/rec/safaz"

[dependency-groups]
dev = [
    "pytest",
    "pytest-regressions",
    "pytest-xdist>=3.8.0",
    "ruff",
    "ty",
    "pyupgrade",
    "envelfo",
]

reference = ["enge", "numpy", "mido"]

[tool.uv]
override-dependencies = [
    "reccy @ git+https://github.com/rec/reccy.git@878920fff1339c823a3956f143bcdfa53cb9e416",
    "middy @ git+ssh://git@github.com/rec/middy.git@0125b962207c47741459a82aa1cc8508d33bde6d",
    "ufor @ git+ssh://git@github.com/rec/ufor.git@f5f8df1372bcec34aec641fc9d385a257f4750cc",
    "envelfo @ git+ssh://git@github.com/rec/envelfo.git@1ed5e050d02dcdcf377081570630e077dac527d0",
]

[tool.uv.sources]
reccy = { git = "https://github.com/rec/reccy.git", rev = "878920fff1339c823a3956f143bcdfa53cb9e416" }
enge = { git = "ssh://git@github.com/rec/enge.git", rev = "ecfaea196191153f3114cdf4129ae33f8a6bbdec" }
ufor = { git = "ssh://git@github.com/rec/ufor.git", rev = "f5f8df1372bcec34aec641fc9d385a257f4750cc" }
envelfo = { git = "ssh://git@github.com/rec/envelfo.git", rev = "1ed5e050d02dcdcf377081570630e077dac527d0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test"]
