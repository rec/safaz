[project]
name = "safaz"
version = "0.2.0"
description = "SFZ import and export for uFor instruments"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.13"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14","Programming Language :: Python :: 3.15"]
dependencies = ["ufor", "pydantic>=2.13.4", "soundfile"]

[project.urls]
Repository = "https://github.com/rec/safaz"

[dependency-groups]
dev = [
    "pytest",
    "pytest-regressions",
    "pytest-xdist>=3.8.0",
    "ruff",
    "ty",
    "pyupgrade",
    "envelfo",
]

reference = ["enge", "numpy", "mido"]

[tool.uv]
override-dependencies = ["ufor @ git+ssh://git@github.com/rec/ufor.git@9c729ff98c55321f3b27ef781aaca747a79ba048"]

[tool.uv.sources]
enge = { git = "ssh://git@github.com/rec/enge.git", rev = "273a90466ec17e8847a0d3cac0f57aa37568c68e" }
ufor = { git = "ssh://git@github.com/rec/ufor.git", rev = "9c729ff98c55321f3b27ef781aaca747a79ba048" }
envelfo = { git = "ssh://git@github.com/rec/envelfo.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test"]
