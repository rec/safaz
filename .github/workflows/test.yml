name: Cross-platform tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Fetch public dependencies without SSH credentials
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test serial default
        run: uv run --no-sync pytest -q
      - name: Test worker isolation
        run: uv run --no-sync pytest -q -n 4 --dist=worksteal
