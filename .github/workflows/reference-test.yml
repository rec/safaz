name: SFZ reference comparisons

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sfztools/sfizz
          ref: f5c6e29f23b8057867c08e88f5f6ac6738baa30b
          submodules: recursive
          path: .reference/sfizz
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Fetch public dependencies without SSH credentials
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install native renderer build toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Install locked reference dependencies
        run: uv sync --frozen --group reference
      - name: Configure unmodified sfizz
        run: >-
          uv run --no-project --with cmake==3.31.10 cmake
          -S .reference/sfizz -B .reference/build
          -DCMAKE_BUILD_TYPE=Release -DSFIZZ_JACK=OFF -DSFIZZ_SHARED=OFF
          -DSFIZZ_TESTS=OFF -DSFIZZ_RENDER=ON -DENABLE_LTO=OFF
          -DCMAKE_CXX_STANDARD=17
      - name: Build upstream offline client
        run: >-
          uv run --no-project --with cmake==3.31.10 cmake
          --build .reference/build --config Release --target sfizz_render --parallel 4
      - name: Compare and preserve findings
        run: uv run --no-sync pytest -q reference_test --require-reference --sfizz-source .reference/sfizz --sfizz-build .reference/build --sfizz-render .reference/build/library/bin/${{ matrix.os == 'windows-2025' && 'Release/sfizz_render.exe' || 'sfizz_render' }}
      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-${{ matrix.os }}
          path: |
            .reference-artifacts/
            .reference/build/CMakeCache.txt
            .reference/build/CMakeFiles/*/CMake*Compiler.cmake
          if-no-files-found: warn
          retention-days: 14
